apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ortelius
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ortelius

  install:
    createNamespace: true

  chart:
    spec:
      chart: ortelius
      version: ">=12.0.323"
      sourceRef:
        kind: HelmRepository
        name: helmcharts
        namespace: flux-system
      interval: 5m

  values:
    global:
      apiBaseUrl: "https://app.deployhub.com"
      baseUrl: "https://app.deployhub.com"
      github:
        appName: "deployhub"
        appId: "2727141"
        clientId: "Iv23liKdUQ34YPWnFfvu"

    frontend:
      graphqlEndpoint: "https://app.deployhub.com/api/v1/graphql"
      restapiEndpoint: "https://app.deployhub.com/api/v1"
      ingress:
        enabled: true
        type: glb
        host: "app.deployhub.com"
        # staticIP is the *name* of the reserved GCP static address (see
        # google_compute_global_address.app / output.static_ip_name in
        # terraform/gke), not its IP value — GCP's ingress.global-static-ip-name
        # annotation requires the resource name. This is hand-maintained;
        # only needs updating if the resource is ever renamed/recreated
        # under a different name.
        staticIP: "static-app-ip"

    ortelius:
      ingress:
        enabled: true
        type: glb
        host: "app.deployhub.com"
        staticIP: "static-app-ip"

      rbac_repo: "https://github.com/ortelius/rbac.git"

      googleOidc:
        clientId: "1095520274207-amhnedlv47f2jlqj0v3itg1a324flfmb.apps.googleusercontent.com"
        allowedDomain: ""

      githubSignin:
        clientId: "Ov23liNEc9dA3puK7HvY"

      smtp:
        enabled: true
        host: "smtp.gmail.com"
        port: "587"
        fromEmail: "steve@deployhub.com"
        fromName: "Steve Taylor"
        username: "steve@deployhub.com"

    relscanner-job: {}

    arangodb: {}

  valuesFrom:
    - kind: Secret
      name: ortelius-secrets