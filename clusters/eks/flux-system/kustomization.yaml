apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - ortelius-kustomization.yaml
  - aws-lbc-helmrepository.yaml
  - aws-lbc-helmrelease.yaml
  - external-dns-helmrepository.yaml
  - external-dns-helmrelease.yaml
patches:
  - target:
      kind: ServiceAccount
      name: kustomize-controller
      namespace: flux-system
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: kustomize-controller
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::754991274490:role/ortelius-eks-flux-sops
  - target:
      kind: ServiceAccount
      name: helm-controller
      namespace: flux-system
    patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: helm-controller
        annotations:
          eks.amazonaws.com/role-arn: arn:aws:iam::754991274490:role/ortelius-eks-flux-sops
  - patch: |
      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: flux-system
        namespace: flux-system
      spec:
        decryption:
          provider: sops
    target:
      kind: Kustomization
      name: flux-system
