apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ortelius
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ortelius
  install:
    createNamespace: true
  chart:
    spec:
      chart: ortelius
      version: ">=12.0.0"
      sourceRef:
        kind: HelmRepository
        name: helmcharts
        namespace: flux-system
      interval: 5m
  values:
    global:
      apiBaseUrl: "https://app.deployhub.com"
      baseUrl: "https://app.deployhub.com"
      github:
        appName: "deployhub"
        appId: "2727141"
        clientId: "Iv23liVE3QJYlS6BGQRa"
    frontend:
      graphqlEndpoint: "https://app.deployhub.com/api/v1/graphql"
      restapiEndpoint: "https://app.deployhub.com/api/v1"
      ingress:
        type: glb
        host: "app.deployhub.com"
    ortelius:---
