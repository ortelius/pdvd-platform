apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ortelius
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: ortelius
  install:
    createNamespace: true
  chart:
    spec:
      chart: ortelius
      version: ">=12.0.0"
      sourceRef:
        kind: HelmRepository
        name: helmcharts
        namespace: flux-system
      interval: 5m
  values:
    frontend:
      graphqlEndpoint: "https://app.deployhub.com/api/v1/graphql"
      restapiEndpoint: "https://app.deployhub.com/api/v1"
      ingress:
        type: glb
        host: "app.deployhub.com"
    ortelius:
      ingress:
        type: glb
        host: "app.deployhub.com"
      rbac_repo: "https://github.com/ortelius/rbac.git"
      apiBaseUrl: "https://app.deployhub.com"
      baseUrl: "https://app.deployhub.com"
      github:
        appName: "deployhub"
        appId: "2727141"
        clientId: "Iv23liVE3QJYlS6BGQRa"
      googleOidc:
        clientId: "1095520274207-amhnedlv47f2jlqj0v3itg1a324flfmb.apps.googleusercontent.com"
        allowedDomain: ""         # blank = any Google account; set to restrict to a Workspace domain
      githubSignin:
        clientId: "Ov23liNEc9dA3puK7HvY"
      smtp:
        enabled: true
        host: "smtp.gmail.com"
        port: "587"
        fromEmail: "steve@deployhub.com"
        fromName: "Steve Taylor"
        username: "steve@deployhub.com"
    arangodb: {}
  valuesFrom:
    - kind: Secret
      name: ortelius-secrets