apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "microservice.name" . }}
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/os: linux
          containers:
            - name: {{ include "microservice.name" . }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: Always
              env:
                - name: ARANGO_USER
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBUserName
                - name: ARANGO_PASS
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBPassword
                - name: ARANGO_HOST
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBHost
                - name: ARANGO_PORT
                  valueFrom:
                    secretKeyRef:
                      name: arangodb
                      key: DBPort
                # --- Non-secret config: shared values from .Values.global ---
                - name: API_BASE_URL
                  value: "{{ .Values.global.apiBaseUrl }}"
                - name: BASE_URL
                  value: "{{ .Values.global.baseUrl }}"
                - name: GITHUB_APP_NAME
                  value: "{{ .Values.global.github.appName }}"
                - name: GITHUB_APP_ID
                  value: "{{ .Values.global.github.appId }}"
                - name: GITHUB_CLIENT_ID
                  value: "{{ .Values.global.github.clientId }}"
                # --- True secrets: pulled from Secret objects ---
                - name: GITHUB_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: ClientSecret
                - name: GITHUB_PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: PrivateKey
                - name: GITHUB_READONLY_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-creds
                      key: ReadOnlyToken
                - name: TOKEN_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: token-encryption
                      key: TokenEncryptionKey
          restartPolicy: OnFailure
      ingress:
        type: glb
        host: "app.deployhub.com"
      rbac_repo: "https://github.com/ortelius/rbac.git"
      googleOidc:
        clientId: "1095520274207-amhnedlv47f2jlqj0v3itg1a324flfmb.apps.googleusercontent.com"
        allowedDomain: ""         # blank = any Google account; set to restrict to a Workspace domain
      githubSignin:
        clientId: "Ov23liNEc9dA3puK7HvY"
      smtp:
        enabled: true
        host: "smtp.gmail.com"
        port: "587"
        fromEmail: "steve@deployhub.com"
        fromName: "Steve Taylor"
        username: "steve@deployhub.com"
    relscanner-job: {}
    arangodb: {}
  valuesFrom:
    - kind: Secret
      name: ortelius-secrets