# clusters/gke-2/ortelius/values.yaml
# Plain (non-secret) values for the ortelius HelmRelease on cluster-3 (gke-2 path).
# Merged with secrets.enc.yaml by FluxCD before passing to Helm.
#
# Secret values (rbac_repo_token, github.clientSecret, github.privateKey,
# smtp.username, smtp.password, arangodb_pass) live in secrets.enc.yaml.

frontend:
  graphqlEndpoint: "https://app.deployhub.com/api/v1/graphql"
  restapiEndpoint: "https://app.deployhub.com/api/v1"
  ingress:
    type: glb
    host: "app.deployhub.com"

ortelius:
  ingress:
    type: glb
    host: "app.deployhub.com"
  rbac_repo: "https://github.com/ortelius/rbac.git"
  apiBaseUrl: "https://app.deployhub.com"
  baseUrl: "https://app.deployhub.com"
  github:
    appName: "deployhub"
    appId: "2727141"
    clientId: "Iv23liKdUQ34YPWnFfvu"
  # NOTE: once chart/ortelius/templates/serviceaccount.yaml exists (see the
  # crypto.go / TOKEN_ENCRYPTION_KEY discussion), set this to the app's GSA
  # email to enable Workload Identity for runtime KMS token encryption:
  # serviceAccount:
  #   annotations:
  #     iam.gke.io/gcp-service-account: ortelius-app@eighth-physics-169321.iam.gserviceaccount.com
  smtp:
    enabled: true
    host: "smtp.gmail.com"
    port: "587"
    fromEmail: "steve@deployhub.com"
    fromName: "Steve Taylor"
    # username and password come from secrets.enc.yaml

arangodb: {}   # password comes from secrets.enc.yaml
